services:
  hub:
    build:
      context: .
      args:
        VITE_LEARNING_LOGS_URL: ${VITE_LEARNING_LOGS_URL:-http://localhost:8001}
        VITE_BLOG_URL: ${VITE_BLOG_URL:-http://localhost:8002}
        VITE_TASK_MANAGER_URL: ${VITE_TASK_MANAGER_URL:-http://localhost:8003}
    ports:
      - "${HUB_PORT:-3000}:80"
    restart: unless-stopped
